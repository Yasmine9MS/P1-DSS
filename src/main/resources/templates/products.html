<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<title>Productos</title>
</head>
<body>

	<h1>Lista de Productos</h1>
	
	<div>
		<a th:href="@{/cart}">Mi Carrito</a>
	</div>
	
	<div>
		<a th:href="@{/products/add}">Añadir</a>
	</div>
	
	<div th:each="product : ${products}">
		<h2 th:text="${product.nombre}"></h2>
		<p th:text="${product.precio}"></p>
		
		<a th:href="@{/products/edit/{id}(id=${product.id})}">Editar</a>
		<form method="post" th:action="@{/products/delete/{id}(id=${product.id})}">
			<button type="submit">Eliminar</button>
		</form>
		
		<form method="post" th:action="@{/cart/add/{id}(id=${product.id})}">
			<button type="submit">Agregar al Carrito</button>
		</form>
		
	</div>
</body>
</html>
