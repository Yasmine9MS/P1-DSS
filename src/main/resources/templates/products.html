<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Catálogo de Productos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container">
		<nav class="navbar navbar-light bg-light">
            <a class="navbar-brand" href="/">
                <img src="https://img.icons8.com/ios-filled/50/000000/home.png" alt="Inicio" width="30" height="30">
            </a>
        </nav>
        <h1 class="text-center my-5">Catálogo de Productos</h1>
        <div class="mb-4">
            <a href="/cart" class="btn btn-secondary">Ver Carrito</a>
        </div>

    
        <form th:action="@{/products/search}" method="get" class="mb-4">
            <div class="input-group">
                <input type="text" name="consulta" class="form-control"
                    placeholder="Buscar producto">
                <button type="submit" class="btn btn-primary">Buscar</button>
            </div>
        </form>

        <form th:action="@{/products/filter}" method="get" class="mb-4">
            <div class="row">
                <div class="col">
                    <input type="number"
                        name="minimo"
                        class="form-control"
                        placeholder="Precio mínimo"
                        step="0.01"
                        min="0">
                </div>

                <div class="col">
                    <input type="number"
                        name="maximo"
                        class="form-control"
                        placeholder="Precio máximo"
                        step="0.01"
                        min="0">
                </div>

                <div class="col-auto">
                    <button type="submit" class="btn btn-primary">
                        Filtrar por precio
                    </button>

                    <a href="/products" class="btn btn-secondary">Borrar Filtros</a>
                </div>
            </div>
        </form>

        <div class="row">
            <div th:each="product : ${products}" class="col-md-4">
                <div class="card mb-4">
                    <div class="card-body">
                        <h5 class="card-title" th:text="${product.nombre}">Nombre del Producto</h5>
                        <p class="card-text" th:text="${product.precio}">Precio</p>
                        <form th:action="@{/cart/add/{id}(id=${product.id})}" method="post">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                            <button type="submit" class="btn btn-primary">Agregar al Carrito</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
